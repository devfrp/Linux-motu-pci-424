[package]
name = "cuemix-studio"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "CueMix FX-style console for MOTU PCI-424 (motu424-ctl) and 828mk3, Linux/macOS/Windows"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
